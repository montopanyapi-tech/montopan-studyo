<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montopan 3D Demo Ev V4.7</title>
<style>
*{box-sizing:border-box;}
html, body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Segoe UI", Arial, sans-serif;background:#eef1f4;color:#27313a;}
#app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}
#topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#ffffff;border-bottom:1px solid #d7dde3;box-shadow:0 1px 4px rgba(0,0,0,.08);z-index:20;}
.brand-area{display:flex;align-items:center;gap:12px;}
.brand{font-size:17px;font-weight:700;color:#26323c;}
.brand strong{color:#168acb;}
.separator{width:1px;height:22px;background:#d5dbe0;}
.project-name{font-size:12px;color:#7a858e;}
.top-status{display:flex;align-items:center;gap:7px;font-size:11px;color:#7b858d;}
.status-dot{width:8px;height:8px;border-radius:50%;background:#38a169;box-shadow:0 0 0 3px rgba(56,161,105,.12);}
#workspace{flex:1;min-height:0;display:flex;overflow:hidden;}
#left-panel{width:255px;flex:0 0 255px;background:#f8fafb;border-right:1px solid #d7dde3;display:flex;flex-direction:column;overflow-y:auto;z-index:15;}
.panel-header{padding:15px 15px 11px;border-bottom:1px solid #e1e5e8;}
.panel-header-title{font-size:13px;font-weight:700;color:#34404a;}
.panel-header-sub{margin-top:3px;font-size:10px;color:#8a949c;}
.tool-section{padding:12px;border-bottom:1px solid #e2e6e9;}
.section-title{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#78838c;}
.section-number{width:19px;height:19px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:#e8f5fc;color:#1385c5;font-size:10px;}
.facade-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.facade-button{height:39px;border:1px solid #d3d9de;background:#ffffff;color:#48545e;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;transition:background .15s, border-color .15s, color .15s;}
.facade-button:hover{border-color:#82bedd;background:#f2f9fd;color:#147db6;}
.facade-button.active{border-color:#1592d0;background:#e9f6fc;color:#0875ad;box-shadow:inset 3px 0 0 #1592d0;}
.panel-upload{width:100%;height:42px;display:flex;align-items:center;justify-content:center;border:1px dashed #9ca9b2;border-radius:4px;background:#ffffff;color:#59656e;cursor:pointer;font-size:11px;font-weight:600;transition:.15s;}
.panel-upload:hover{border-color:#1592d0;background:#f1f9fd;color:#137fb5;}
input[type="file"]{display:none;}
.file-info{margin-top:8px;padding:7px 8px;background:#eef2f5;border-radius:4px;font-size:10px;color:#7b858d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slider-row{display:flex;align-items:center;gap:8px;}
.slider-row input{flex:1;accent-color:#158dcc;}
.slider-value{min-width:38px;text-align:right;font-size:10px;font-weight:700;color:#1687c3;}
.panel-preview{width:100%;height:75px;margin-top:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #d9dfe4;border-radius:4px;background:repeating-conic-gradient(#edf0f2 0% 25%, #ffffff 0% 50%) 50% / 14px 14px;}
.panel-preview img{max-width:100%;max-height:100%;object-fit:contain;}
.info-box{padding:10px;background:#ffffff;border:1px solid #dce2e6;border-radius:4px;font-size:10px;line-height:1.55;color:#7b858d;}
#viewer-area{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(180deg, #f3f5f7 0%, #e9edef 100%);}
#view-label{position:absolute;top:14px;left:14px;padding:7px 10px;background:rgba(255,255,255,.92);border:1px solid #d8dee3;border-radius:4px;font-size:10px;color:#69747d;z-index:8;box-shadow:0 2px 8px rgba(0,0,0,.06);}
#viewer{position:absolute;inset:0;}
#bottom-toolbar{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:6px;padding:6px;background:rgba(255,255,255,.96);border:1px solid #d4dbe0;border-radius:5px;box-shadow:0 3px 14px rgba(0,0,0,.10);z-index:12;}
.bottom-button{height:34px;padding:0 13px;border:1px solid #d1d8dd;border-radius:4px;background:#ffffff;color:#4b5760;cursor:pointer;font-size:10px;font-weight:600;white-space:nowrap;transition:.15s;}
.bottom-button:hover{border-color:#7bb9d9;background:#f3f9fc;color:#117db5;}
.bottom-button.primary{background:#148dcc;border-color:#148dcc;color:#ffffff;}
.bottom-button.primary:hover{background:#0d79b1;border-color:#0d79b1;}
.bottom-button.danger:hover{color:#c0392b;border-color:#e0a9a4;background:#fff7f6;}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#eef1f4;color:#66737c;font-size:13px;z-index:100;transition:opacity .45s ease;}
#loading.hidden{opacity:0;pointer-events:none;}
#left-panel::-webkit-scrollbar{width:6px;}
#left-panel::-webkit-scrollbar-track{background:#f2f4f6;}
#left-panel::-webkit-scrollbar-thumb{background:#c6ced4;border-radius:4px;}
</style>
</head>

<body>
<div id="app">
    <header id="topbar">
        <div class="brand-area">
            <div class="brand">Montopan <strong>3D</strong></div>
            <div class="separator"></div>
            <div class="project-name">Demo Ev • Cephe Tasarım</div>
        </div>
        <div class="top-status">
            <span class="status-dot"></span> Canlı Sistem
        </div>
    </header>

    <main id="workspace">
        <aside id="left-panel">
            <div class="panel-header">
                <div class="panel-header-title">Tasarım Araçları</div>
                <div class="panel-header-sub">Demo ev cephe düzenleme</div>
            </div>

            <section class="tool-section">
                <div class="section-title">
                    <span class="section-number">1</span> Cephe Seçimi
                </div>
                <div class="facade-grid">
                    <button class="facade-button active" id="frontBtn">Ön Cephe</button>
                    <button class="facade-button" id="rightBtn">Sağ Cephe</button>
                    <button class="facade-button" id="backBtn">Arka Cephe</button>
                    <button class="facade-button" id="leftBtn">Sol Cephe</button>
                </div>
            </section>

            <section class="tool-section">
                <div class="section-title">
                    <span class="section-number">2</span> Panel Uygulama
                </div>
                <label for="panelInput" class="panel-upload">+ Panel Seç</label>
                <input type="file" id="panelInput" accept="image/*">
                <div class="file-info" id="fileName">Henüz panel seçilmedi</div>
                <div class="panel-preview">
                    <img id="panelPreview" alt="">
                </div>
            </section>

            <section class="tool-section">
                <div class="section-title">
                    <span class="section-number">3</span> Panel Ölçeği
                </div>
                <div class="slider-row">
                    <input type="range" id="scaleSlider" min="50" max="300" value="125">
                    <span class="slider-value" id="scaleValue">125px</span>
                </div>
            </section>

            <section class="tool-section">
                <div class="section-title">
                    <span class="section-number">4</span> Çalışma Bilgisi
                </div>
                <div class="info-box">
                    Fare ile sürükleyerek evi dilediğiniz gibi döndürebilirsiniz.
                </div>
            </section>
        </aside>

        <section id="viewer-area">
            <div id="view-label">Ön Cephe</div>
            <div id="loading">Montopan 3D Model Yükleniyor...</div>
            <div id="viewer"></div>

            <div id="bottom-toolbar">
                <button class="bottom-button" id="homeBtn">Başlangıç</button>
                <button class="bottom-button" id="saveBtn">PNG Kaydet</button>
                <button class="bottom-button danger" id="resetBtn">Sıfırla</button>
            </div>
        </section>
    </main>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { MTLLoader } from "three/addons/loaders/MTLLoader.js";

// Sahne
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9edef);

// Kamera
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
camera.position.set(10, 5, 12);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById("viewer").appendChild(renderer.domElement);

// Orbit Controls (Doğrudan Serbest Döndürme Açık)
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .065;
controls.enablePan = true;
controls.enableRotate = true; 
controls.minDistance = 4;
controls.maxDistance = 25;
controls.minPolarAngle = THREE.MathUtils.degToRad(20);
controls.maxPolarAngle = THREE.MathUtils.degToRad(85);
controls.target.set(0, 1.5, 0);
controls.update();

// Işıklar
const hemi = new THREE.HemisphereLight(0xffffff, 0x667788, 2.3);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 3.8);
sun.position.set(12, 20, 15);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
scene.add(sun);

// Zemin
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(70, 70),
    new THREE.MeshStandardMaterial({ color: 0xd2d8d4, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Ana Ev Grubu
const house = new THREE.Group();
house.name = "MontopanDemoHouse";
scene.add(house);

// MTL ve OBJ Yükleme
const mtlLoader = new MTLLoader();
mtlLoader.load('demoev.mtl', function (materials) {
    materials.preload();
    
    const objLoader = new OBJLoader();
    objLoader.setMaterials(materials);
    objLoader.load(
        'demoev.obj',
        function (object) {
            const box = new THREE.Box3().setFromObject(object);
            const size = new THREE.Vector3();
            box.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 7 / maxDim; 
            object.scale.set(scale, scale, scale);
            
            const center = new THREE.Vector3();
            box.getCenter(center);
            object.position.x = -center.x * scale;
            object.position.y = (-center.y * scale) + 1.5;
            object.position.z = -center.z * scale;

            object.traverse(function (child) {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            house.add(object);
            document.getElementById('loading').classList.add('hidden');
        },
        undefined,
        function (error) {
            console.error('OBJ yükleme hatası:', error);
        }
    );
}, undefined, function (error) {
    console.error('MTL yükleme hatası:', error);
});

// Buton Yönetimi
const frontBtn = document.getElementById('frontBtn');
const rightBtn = document.getElementById('rightBtn');
const backBtn = document.getElementById('backBtn');
const leftBtn = document.getElementById('leftBtn');
const viewLabel = document.getElementById('view-label');

function setActiveFacade(btn, labelText, targetPos) {
    document.querySelectorAll('.facade-button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    viewLabel.innerText = labelText;
    
    camera.position.set(targetPos.x, targetPos.y, targetPos.z);
    controls.target.set(0, 1.5, 0);
    controls.update();
}

frontBtn.addEventListener('click', () => setActiveFacade(frontBtn, 'Ön Cephe', {x: 0, y: 5, z: 12}));
rightBtn.addEventListener('click', () => setActiveFacade(rightBtn, 'Sağ Cephe', {x: 12, y: 5, z: 0}));
backBtn.addEventListener('click', () => setActiveFacade(backBtn, 'Arka Cephe', {x: 0, y: 5, z: -12}));
leftBtn.addEventListener('click', () => setActiveFacade(leftBtn, 'Sol Cephe', {x: -12, y: 5, z: 0}));

document.getElementById('homeBtn').addEventListener('click', () => {
    camera.position.set(10, 5, 12);
    controls.target.set(0, 1.5, 0);
    controls.update();
});

document.getElementById('resetBtn').addEventListener('click', () => {
    location.reload();
});

const scaleSlider = document.getElementById('scaleSlider');
const scaleValue = document.getElementById('scaleValue');
scaleSlider.addEventListener('input', (e) => {
    scaleValue.innerText = e.target.value + 'px';
});

const panelInput = document.getElementById('panelInput');
const fileName = document.getElementById('fileName');
const panelPreview = document.getElementById('panelPreview');

panelInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        fileName.innerText = file.name;
        const reader = new FileReader();
        reader.onload = function(event) {
            panelPreview.src = event.target.result;
            
            // Seçilen paneli modelin üzerindeki materyallere uygulama mantığı buraya eklenecek
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(event.target.result, function(texture) {
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(4, 4); // Panel tekrar sayısı
                
                house.traverse(function(child) {
                    if (child.isMesh) {
                        child.material.map = texture;
                        child.material.needsUpdate = true;
                    }
                });
            });
        }
        reader.readAsDataURL(file);
    }
});

function resizeViewer() {
    const area = document.getElementById('viewer-area');
    camera.aspect = area.clientWidth / area.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(area.clientWidth, area.clientHeight);
}
window.addEventListener('resize', resizeViewer);
resizeViewer();

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
